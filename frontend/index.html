<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Snake Game</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <div id="start-screen" class="screen">
            <h1>ML Snake Game</h1>
            <form id="start-form">
                <input type="text" id="player-name" placeholder="Enter your name" required>
                <div class="skills-selection">
                    <h3>Select your skills:</h3>
                    <label>
                        <input type="checkbox" name="skill-checkbox" value="frontend"> Frontend (HTML, CSS, JS)
                    </label>
                    <label>
                        <input type="checkbox" name="skill-checkbox" value="backend"> Backend (Python, Java)
                    </label>
                    <label>
                        <input type="checkbox" name="skill-checkbox" value="database"> Database (SQL, NoSQL)
                    </label>
                    <label>
                        <input type="checkbox" name="skill-checkbox" value="ml"> Machine Learning
                    </label>
                    <label>
                        <input type="checkbox" name="skill-checkbox" value="cloud"> Cloud (AWS, Azure)
                    </label>
                </div>
                <button type="submit" class="start-btn">Start Game</button>
            </form>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="game-header">
                <div class="score-display">Score: <span id="score">0</span></div>
            </div>
            <canvas id="game-canvas"></canvas>
            <div class="controls">
                <button id="pause-btn">Pause</button>
                <button id="restart-btn">Restart</button>
            </div>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h2>Game Over!</h2>
            <div id="final-score" class="score-display"></div>
            <button id="play-again-btn">Play Again</button>
            <div id="leaderboard">
                <h3>Leaderboard</h3>
                <ul id="leaderboard-list"></ul>
            </div>
        </div>
    </div>
    <script src="static/script.js"></script>
</body>
</html>
